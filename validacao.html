<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 350px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .campo { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        /* Estilo do parágrafo de erro */
        #erro { color: #dc3545; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Cadastro de Usuário</h2>

    <form id="formCadastro">
        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </div>

        <div class="campo">
            <label for="email">E-mail:</label>
            <input type="text" id="email">
        </div>

        <div class="campo">
            <label for="idade">Idade:</label>
            <input type="number" id="idade">
        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <p id="erro"></p>

    <script src="validacao.js"></script>
</body>
</html>
